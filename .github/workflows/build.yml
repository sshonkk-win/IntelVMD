name: Build IntelVMD

on:
  push:
    branches: [ "main", "tahoe" ]
  pull_request:
    branches: [ "main", "tahoe" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build Target
        run: |
          xcodebuild -project IntelVMD-tahoe/IntelVMD.xcodeproj \
                     -target IntelVMD \
                     -configuration Release \
                     ONLY_ACTIVE_ARCH=NO \
                     SYMROOT="$(PWD)/build"

      - name: Upload Built Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IntelVMD-tahoe-Release
          path: build/Release/*.kext
          if-no-files-found: error
